summary: This document presents a collection of calculus exercises and proofs focused
  on evaluating limits, covering topics such as limit definitions, infinite series,
  trigonometric limits, and sequences. Key findings include proofs for limits like
  lim x sin(1/x)=0 as x→0, lim (1+2x²)/(2-x²)=-2 as x→∞, and lim ln x=-∞ as x→0+,
  as well as evaluations of infinite products and sums, such as the telescoping series
  result of 1/6 and the geometric product limit 1/(1-r) for |r|<1. It also addresses
  limits involving harmonic series, maximum values of sequences, and trigonometric
  identities, concluding with methods like the squeeze theorem and monotonic convergence
  to establish results such as the limit of a Fibonacci-like sequence converging to
  the golden ratio (1+√5)/2. The exercises demonstrate rigorous ε-δ and algebraic
  techniques for limit computation and analysis.
