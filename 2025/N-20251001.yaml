summary: This document presents a collection of calculus problems and solutions, focusing
  on limit evaluations and continuity proofs. Key findings include the computation
  of various limits using trigonometric identities, logarithmic properties, and asymptotic
  approximations, such as lim_{x→π/4} [tan2x·tan(π/4−x)/(x−π/4)] = 1/2 and lim_{x→∞}
  (ln(1+3^x)/ln(1+2^x)) = ln3/ln2. It also addresses continuity through the Intermediate
  Value Theorem, proving the existence of roots for polynomial functions and demonstrating
  that for continuous functions f and g on [a,b] with f(a)>g(a) and f(b)≤g(b), there
  exists ξ where f(ξ)=g(ξ). The document concludes with parameter determination, e.g.,
  finding a=−3/2 for a specific limit condition.
